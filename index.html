<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    a {
      display: block;       /* 줄바꿈 효과 */
      margin: 8px 0;        /* 위아래 간격 */
      color: #007acc;       /* 파란색 링크 */
      text-decoration: none;
      font-size: 18px;
    }
    a:hover {
      text-decoration: underline;
      color: #005999;       /* hover 시 진한 파란색 */
    }
  </style>
</head>
<body>
  <a href="nostyle.html">nostyle</a>
  <a href="style1.html">style1</a>
  <a href="style2.html">style2</a>
</body>
</html>
